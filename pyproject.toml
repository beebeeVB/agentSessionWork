[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-forecast"
version = "0.2.0"
description = "Early forecasting of LLM agent session length, with honest uncertainty (account-grouped evaluation, paired bootstraps, conformal intervals)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "scipy>=1.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# only needed to read the real trace from Hugging Face (not for --synthetic)
data = ["zstandard", "huggingface_hub"]
parquet = ["pyarrow", "huggingface_hub"]       # --source parquet / --parquet-dir
seq = ["torch"]                                  # --sequence uses a GRU (MLP fallback without it)
stats = ["statsmodels"]                          # --hierarchical REML cross-check
dev = ["pytest", "pyflakes"]

[project.scripts]
session-forecast = "agent_session_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: runs the whole pipeline on synthetic data (~20s)"]
